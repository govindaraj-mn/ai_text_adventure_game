services:
  - type: web
    name: escape-silk-board
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-flash
      - key: LLM_MAX_TOKENS
        value: "2000"
      - key: LLM_JSON_MODE
        value: "1"
      - key: LLM_API_KEY
        sync: false
      - key: STATE_SECRET
        sync: false
